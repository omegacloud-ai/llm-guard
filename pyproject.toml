[project]
name = "llm-guard"
description = "LLM-Guard is a comprehensive tool designed to fortify the security of Large Language Models (LLMs). By offering sanitization, detection of harmful language, prevention of data leakage, and resistance against prompt injection attacks, LLM-Guard ensures that your interactions with LLMs remain safe and secure."
authors = [{ name = "Protect AI", email = "community@protectai.com" }]
keywords = [
  "llm",
  "language model",
  "security",
  "adversarial attacks",
  "prompt injection",
  "prompt leakage",
  "PII detection",
  "self-hardening",
  "firewall",
]
license = { file = "LICENSE" }
readme = "README.md"
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<3.13"

dependencies = [
  "bc-detect-secrets==1.5.15",
  "faker>=26.0.0",
  "fuzzysearch>=0.7",
  "json-repair>=0.61.0",
  "nltk>=3.9.4",
  "presidio-analyzer==2.2.363",
  "presidio-anonymizer==2.2.363",
  "regex>=2024.7.24",
  "tiktoken>=0.5",
  "torch>=2.4.0",
  "transformers>=5.5,<6",
  "cryptography>=48.0.1",
  "structlog>=24",
  "numpy>=1.26",
]

[project.optional-dependencies]
# ONNX extras removed: optimum-onnx (latest 0.1.0) requires transformers<4.58 and
# fails to import under transformers 5.x. Scanners with use_onnx=True fall back to
# PyTorch. Restore once optimum-onnx supports transformers 5.
docs-dev = [
  "mkdocs>=1.6,<2",
  "mkdocs-autorefs==1.1.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mkdocs-jupyter>=0.24",
  "mkdocs-material>=9.5",
  "mkdocs-material-extensions>=1.3",
  "mkdocs-swagger-ui-tag>=0.6",
]
dev = [
  "llm_guard[docs-dev]",
  # spacy models pre-installed as wheels: uv venvs have no pip, so the runtime
  # spacy.cli.download fallback in anonymize_helpers/analyzer.py cannot work.
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "zh_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
  "autoflake>=2,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0.0,<8",
  "pre-commit>=3.8,<4",
  "pyright~=1.1.376",
  "ruff>=0.6.1,<0.7.0",
]

[project.urls]
homepage = "https://github.com/protectai/llm-guard"
documentation = "https://llm-guard.com/"
repository = "https://github.com/protectai/llm-guard"
issues = "https://github.com/protectai/llm-guard/issues"
changelog = "https://llm-guard.com/changelog/"

# presidio-anonymizer 2.2.363 caps cryptography <47; it only uses stable
# hazmat AES APIs, so we force the patched version past the cap.
[tool.uv]
override-dependencies = ["cryptography>=48.0.1"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["llm_guard", "llm_guard.*"] } }
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "llm_guard.version.__version__" }

[tool.setuptools.package-data]
llm_guard = ["**/*.json"]

[tool.pytest.ini_options]
addopts = "-p no:warnings"
log-level = "DEBUG"

# The flag below should only be activated in special debug sessions
# i.e. the test hangs and we need to see what happened up to that point.
# There are some race conditions with how the logging streams are closed in the teardown
# phase, which will cause tests to fail or "magically" ignored.
log_cli = "False"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
